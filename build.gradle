// Cogito for Minecraft 26.1.2. The build itself is shared with the other versions, in gradle/cogito.gradle;
// versions/1.21.1/ builds Minecraft 1.21.1 the same way (gradlew -p versions/1.21.1 build).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: 'gradle/cogito.gradle'

// Optional and private: a VLA dataset module may sit beside this project, in ../cogito-dataset, outside the
// repository. When it is there, dev runs load it as a second mod; without it the mod builds and runs the same.
ext.datasetDir = rootProject.file('../cogito-dataset')
if (new File(datasetDir, 'dataset.gradle').exists()) {
    apply from: new File(datasetDir, 'dataset.gradle')
}
