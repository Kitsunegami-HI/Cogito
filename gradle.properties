org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The mod's own fields, shared by every Minecraft version (versions/<version>/ builds read them from here).
mod_id=cogito
mod_name=Cogito
mod_license=MIT
mod_version=0.3.0
mod_group_id=dev.cogito

anthropic_java_version=3.2.0
openai_java_version=4.101.0
google_genai_version=1.80.0

# What this build (the repository root) targets: Minecraft 26.1.2.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.112
neo_version_range=[26.1.2.100,)
java_version=25
baritone_jar=baritone-api-neoforge-1.18.0.jar
# Libraries the game ships itself (see gradle/cogito.gradle).
game_libs=com.google.guava,com.google.code.gson:gson,commons-codec:commons-codec,org.jspecify:jspecify,org.slf4j
