org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Cogito for Minecraft 1.21.1. The mod's own fields come from the repository's gradle.properties.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.267
neo_version_range=[21.1.200,)
java_version=21
baritone_jar=baritone-api-neoforge-1.11.3.jar
# Libraries the game ships itself, at the versions Minecraft 1.21.1 pins; the SDKs ask for newer ones but run on these.
# Error Prone and J2ObjC annotations come with the game's Guava; javax.annotation-api would split the package the
# game's jsr305 owns, and the SDKs only need its annotations at compile time.
game_libs=com.google.guava:guava:32.1.2-jre,com.google.guava:failureaccess:1.0.1,com.google.code.gson:gson:2.10.1,commons-codec:commons-codec:1.16.0,org.apache.httpcomponents:httpclient:4.5.13,org.apache.httpcomponents:httpcore:4.4.16,commons-logging:commons-logging:1.2,org.slf4j:slf4j-api:2.0.9,com.google.errorprone:error_prone_annotations:2.18.0,com.google.j2objc:j2objc-annotations:2.8,javax.annotation:javax.annotation-api
# Dev runs on this loader need the SDKs named on the additional runtime classpath (see gradle/cogito.gradle).
sdk_dev_classpath=additional
# The jar is named cogito-<mod version>+mc1.21.1.jar.
jar_version_suffix=+mc1.21.1
